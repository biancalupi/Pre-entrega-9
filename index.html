<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dietética Natural - Simulador de Compras</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>La Dietética Market</h1>
        <div id="banner-promocion" class="banner hidden"></div>
    </header>

    <main>
        <section id="simulador-compras">
            <h2>Simulador de Presupuesto</h2>
            <form id="form-pedido">
                <label for="producto">Producto en gramos/kilos:</label>
                <select id="producto">
                    <option value="">-- Seleccionar producto --</option>
                    <option value="almendras">Almendras ($15/g)</option>
                    <option value="nueces">Nueces ($12/g)</option>
                    <option value="chia">Semillas de Chía ($5/g)</option>
                    <option value="granola">Granola Artesanal ($8/g)</option>
                </select>

                <label for="cantidad">Cantidad en gramos:</label>
                <input type="number" id="cantidad" placeholder="Ej: 250">

                <button type="submit">Calcular Total</button>
            </form>

            <div id="mensaje-estado"></div>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
